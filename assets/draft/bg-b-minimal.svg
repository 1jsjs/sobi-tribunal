<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="법정 배경 - 미니멀">
  <defs>
    <!-- 스포트라이트: 은은한 골드 원형 그라디언트 -->
    <radialGradient id="spotlight" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <!-- 배경 상하 미묘한 깊이 -->
    <linearGradient id="bgDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="70%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#0b0f18"/>
    </linearGradient>
    <!-- 단상 목재 그라디언트 -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#2a1f18"/>
    </linearGradient>
  </defs>

  <!-- 바탕 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#bgDepth)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#spotlight)"/>

  <!-- ===== 좌우 기둥 실루엣 (골드 라인, 저대비) ===== -->
  <g stroke="#d4af37" stroke-width="2" fill="none" opacity="0.28" stroke-linecap="round" stroke-linejoin="round">
    <!-- 왼쪽 기둥 -->
    <g>
      <rect x="60" y="96" width="76" height="14" rx="5"/>
      <rect x="70" y="110" width="56" height="10" rx="4"/>
      <line x1="80" y1="128" x2="80" y2="420"/>
      <line x1="98" y1="128" x2="98" y2="420"/>
      <line x1="116" y1="128" x2="116" y2="420"/>
      <rect x="70" y="426" width="56" height="10" rx="4"/>
      <rect x="60" y="436" width="76" height="14" rx="5"/>
    </g>
    <!-- 오른쪽 기둥 -->
    <g>
      <rect x="664" y="96" width="76" height="14" rx="5"/>
      <rect x="674" y="110" width="56" height="10" rx="4"/>
      <line x1="684" y1="128" x2="684" y2="420"/>
      <line x1="702" y1="128" x2="702" y2="420"/>
      <line x1="720" y1="128" x2="720" y2="420"/>
      <rect x="674" y="426" width="56" height="10" rx="4"/>
      <rect x="664" y="436" width="76" height="14" rx="5"/>
    </g>
  </g>

  <!-- ===== 중앙 저울 (골드 라인) ===== -->
  <g stroke="#d4af37" stroke-width="2.5" fill="none" opacity="0.42" stroke-linecap="round" stroke-linejoin="round">
    <!-- 기둥과 가로대 -->
    <line x1="400" y1="120" x2="400" y2="300"/>
    <line x1="290" y1="150" x2="510" y2="150"/>
    <circle cx="400" cy="120" r="8"/>
    <!-- 왼쪽 접시 -->
    <line x1="290" y1="150" x2="270" y2="215"/>
    <line x1="290" y1="150" x2="310" y2="215"/>
    <path d="M 258 215 A 32 32 0 0 0 322 215 Z"/>
    <!-- 오른쪽 접시 -->
    <line x1="510" y1="150" x2="490" y2="215"/>
    <line x1="510" y1="150" x2="530" y2="215"/>
    <path d="M 478 215 A 32 32 0 0 0 542 215 Z"/>
    <!-- 받침 -->
    <line x1="360" y1="300" x2="440" y2="300"/>
  </g>
  <!-- 저울 하이라이트 포인트 -->
  <circle cx="400" cy="120" r="3" fill="#e8c96a" opacity="0.5"/>

  <!-- ===== 하단 다크우드 단상 실루엣 ===== -->
  <!-- 뒷단 (판사석 뒷벽 느낌) -->
  <rect x="150" y="440" width="500" height="60" rx="10" fill="#2a1f18" stroke="#1a120c" stroke-width="3"/>
  <!-- 메인 단상 -->
  <rect x="90" y="470" width="620" height="90" rx="14" fill="url(#wood)" stroke="#1a120c" stroke-width="3"/>
  <!-- 단상 상판 몰딩 -->
  <rect x="76" y="460" width="648" height="20" rx="10" fill="#3d2b1f" stroke="#1a120c" stroke-width="3"/>
  <!-- 상판 골드 트림 라인 -->
  <line x1="104" y1="470" x2="696" y2="470" stroke="#d4af37" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <!-- 단상 패널 라인 (좌우 대칭) -->
  <g stroke="#1a120c" stroke-width="3" opacity="0.8">
    <line x1="240" y1="488" x2="240" y2="548"/>
    <line x1="400" y1="488" x2="400" y2="548"/>
    <line x1="560" y1="488" x2="560" y2="548"/>
  </g>
  <!-- 중앙 문양: 골드 로제트 -->
  <g opacity="0.45">
    <circle cx="400" cy="518" r="17" fill="none" stroke="#d4af37" stroke-width="2"/>
    <circle cx="400" cy="518" r="7" fill="none" stroke="#e8c96a" stroke-width="2"/>
  </g>

  <!-- 바닥 마감선 -->
  <rect x="0" y="560" width="800" height="40" fill="#0b0f18"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#1a120c" stroke-width="3"/>

  <!-- 최소 한글 텍스트: 단상 명패 -->
  <g>
    <rect x="337" y="443" width="126" height="24" rx="6" fill="#f5e9d0" stroke="#1a120c" stroke-width="2.5" opacity="0.9"/>
    <text x="400" y="460" text-anchor="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#2a1f18">소비 재판소</text>
  </g>
</svg>

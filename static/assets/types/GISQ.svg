<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calm listener with big headphones and music notes">
  <defs>
    <linearGradient id="skinGISQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- quiet background -->
  <circle cx="200" cy="200" r="200" fill="#141c30"/>
  <circle cx="200" cy="200" r="165" fill="#1c2740" opacity="0.85"/>
  <circle cx="200" cy="200" r="125" fill="#d4af37" opacity="0.06"/>

  <!-- music notes -->
  <g fill="#e8c96a" stroke="#e8c96a">
    <ellipse cx="296" cy="138" rx="8" ry="6" stroke="none" transform="rotate(-16 296 138)"/>
    <ellipse cx="322" cy="130" rx="8" ry="6" stroke="none" transform="rotate(-16 322 130)"/>
    <line x1="303" y1="136" x2="303" y2="102" stroke-width="5" stroke-linecap="round"/>
    <line x1="329" y1="128" x2="329" y2="94" stroke-width="5" stroke-linecap="round"/>
    <path d="M303 102 L329 94 L329 106 L303 114 Z" stroke="none"/>
  </g>
  <g fill="#d4af37" stroke="#d4af37">
    <ellipse cx="80" cy="132" rx="8" ry="6" stroke="none" transform="rotate(-16 80 132)"/>
    <line x1="87" y1="130" x2="87" y2="96" stroke-width="5" stroke-linecap="round"/>
    <path d="M87 96 Q104 102 96 120" fill="none" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- body: calm parchment top with round shoulders -->
  <path d="M108 400 L108 344 Q108 296 156 288 L244 288 Q292 296 292 344 L292 400 Z"
        fill="#f5e9d0" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- relaxed hands -->
  <circle cx="124" cy="330" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <circle cx="276" cy="330" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinGISQ)" stroke="#1a120c" stroke-width="6"/>

  <!-- hair: side locks + bang -->
  <path d="M120 146 Q104 178 114 212 Q122 218 130 212 Q118 182 132 150 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M280 146 Q296 178 286 212 Q278 218 270 212 Q282 182 268 150 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- headphone band -->
  <path d="M112 168 Q200 -32 288 168 L268 168 Q200 12 132 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <!-- ear cups -->
  <ellipse cx="112" cy="182" rx="22" ry="34" fill="#2a1f18" stroke="#1a120c" stroke-width="6"/>
  <ellipse cx="288" cy="182" rx="22" ry="34" fill="#2a1f18" stroke="#1a120c" stroke-width="6"/>
  <ellipse cx="112" cy="182" rx="9" ry="20" fill="#d4af37" opacity="0.45"/>
  <ellipse cx="288" cy="182" rx="9" ry="20" fill="#d4af37" opacity="0.45"/>

  <!-- calm brows -->
  <path d="M154 152 Q166 148 178 152" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M222 152 Q234 148 246 152" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- gently closed eyes -->
  <path d="M152 172 Q166 182 180 172" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M220 172 Q234 182 248 172" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- small nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- content little smile -->
  <path d="M186 232 Q200 244 214 232" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
</svg>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GRSD — confident fashion spirit">
  <defs>
    <linearGradient id="skinGRSD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="200" cy="200" r="200" fill="#0f1420"/>
  <circle cx="200" cy="200" r="160" fill="#d4af37" opacity="0.09"/>
  <circle cx="200" cy="200" r="120" fill="#e8c96a" opacity="0.07"/>

  <!-- wind lines -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M48 150 Q84 142 112 150"/>
    <path d="M40 190 Q80 182 104 190"/>
    <path d="M56 236 Q88 230 114 238"/>
  </g>
  <!-- sparkle -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="322" y1="96" x2="322" y2="116"/><line x1="312" y1="106" x2="332" y2="106"/>
  </g>

  <!-- neck -->
  <path d="M184 252 L216 252 L216 294 L184 294 Z" fill="#eec49c" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- body (navy jacket, round shoulders) -->
  <path d="M110 400 L112 340 Q118 300 156 290 L244 290 Q282 300 288 340 L290 400 Z"
        fill="#1c2740" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- hands at sides -->
  <circle cx="100" cy="330" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <circle cx="300" cy="336" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinGRSD)" stroke="#1a120c" stroke-width="6"/>
  <!-- hair -->
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 166 Q112 184 120 200 Q130 190 128 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M286 166 Q288 184 280 200 Q270 190 272 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- confident angled brows -->
  <path d="M148 152 L182 146" stroke="#1a120c" stroke-width="5" stroke-linecap="round"/>
  <path d="M218 146 L252 152" stroke="#1a120c" stroke-width="5" stroke-linecap="round"/>
  <!-- dot eyes -->
  <circle cx="166" cy="172" r="7" fill="#1a120c"/>
  <circle cx="234" cy="172" r="7" fill="#1a120c"/>
  <circle cx="168" cy="169" r="2.4" fill="#f5e9d0"/>
  <circle cx="236" cy="169" r="2.4" fill="#f5e9d0"/>

  <!-- nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- confident smirk -->
  <path d="M172 230 Q204 246 232 222" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>

  <!-- flowing scarf: neck band -->
  <path d="M138 272 Q200 300 262 272 L262 296 Q200 322 138 296 Z"
        fill="#b3261e" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 288 Q200 304 230 288" stroke="#7a1a14" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- scarf tails flying in the wind -->
  <path d="M244 274 Q290 280 316 262 Q342 244 352 250 Q346 272 322 286 Q292 302 248 296 Z"
        fill="#b3261e" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M246 292 Q292 306 330 300 Q346 296 350 304 Q332 322 300 322 Q268 320 244 306 Z"
        fill="#b3261e" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
</svg>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GRSQ — happy gift shopper">
  <defs>
    <linearGradient id="skinGRSQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="200" cy="200" r="200" fill="#1c2740"/>
  <circle cx="200" cy="200" r="160" fill="#d4af37" opacity="0.12"/>
  <circle cx="200" cy="200" r="120" fill="#e8c96a" opacity="0.10"/>

  <!-- sparkles -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="78" y1="118" x2="78" y2="142"/><line x1="66" y1="130" x2="90" y2="130"/>
    <line x1="322" y1="96" x2="322" y2="118"/><line x1="311" y1="107" x2="333" y2="107"/>
    <line x1="330" y1="236" x2="330" y2="254"/><line x1="321" y1="245" x2="339" y2="245"/>
    <line x1="66" y1="250" x2="66" y2="268"/><line x1="57" y1="259" x2="75" y2="259"/>
  </g>

  <!-- neck -->
  <path d="M184 252 L216 252 L216 294 L184 294 Z" fill="#eec49c" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- body (gold top, round shoulders) -->
  <path d="M110 400 L112 340 Q118 300 156 290 L244 290 Q282 300 288 340 L290 400 Z"
        fill="#d4af37" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinGRSQ)" stroke="#1a120c" stroke-width="6"/>
  <!-- hair -->
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 166 Q112 184 120 200 Q130 190 128 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M286 166 Q288 184 280 200 Q270 190 272 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- happy brows -->
  <path d="M150 148 Q166 141 182 148" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M218 148 Q234 141 250 148" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- dot eyes -->
  <circle cx="166" cy="172" r="7" fill="#1a120c"/>
  <circle cx="234" cy="172" r="7" fill="#1a120c"/>
  <circle cx="168" cy="169" r="2.4" fill="#f5e9d0"/>
  <circle cx="236" cy="169" r="2.4" fill="#f5e9d0"/>

  <!-- nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- big happy smile -->
  <path d="M168 226 Q200 250 232 226" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>

  <!-- gift box hugged in front -->
  <rect x="142" y="310" width="116" height="26" rx="4" fill="#d4af37" stroke="#1a120c" stroke-width="6"/>
  <rect x="150" y="336" width="100" height="50" fill="#e8c96a" stroke="#1a120c" stroke-width="6"/>
  <rect x="189" y="310" width="22" height="76" fill="#b3261e" stroke="#1a120c" stroke-width="5"/>
  <!-- ribbon bow -->
  <path d="M200 306 Q160 292 168 272 Q188 262 202 300 Z" fill="#b3261e" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M200 306 Q240 292 232 272 Q212 262 198 300 Z" fill="#b3261e" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="200" cy="304" r="9" fill="#b3261e" stroke="#1a120c" stroke-width="5"/>
  <!-- hugging hands -->
  <circle cx="132" cy="344" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <circle cx="268" cy="344" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
</svg>

  </defs>
  <!-- 배경 원 (골드 글로우) -->
  <circle cx="200" cy="200" r="200" fill="#1c2740"/>
  <circle cx="200" cy="200" r="165" fill="#d4af37" opacity="0.14"/>
  <circle cx="200" cy="200" r="125" fill="#e8c96a" opacity="0.12"/>

  <!-- 반짝이 -->
  <g stroke="#e8c96a" stroke-width="6" stroke-linecap="round">
    <line x1="76" y1="120" x2="76" y2="146"/><line x1="63" y1="133" x2="89" y2="133"/>
    <line x1="322" y1="96" x2="322" y2="118"/><line x1="311" y1="107" x2="333" y2="107"/>

  <path d="M160 236 Q200 268 240 236" stroke="#1a120c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- 볼터치 -->
  <ellipse cx="140" cy="206" rx="14" ry="9" fill="#b3261e" opacity="0.28"/>
  <ellipse cx="260" cy="206" rx="14" ry="9" fill="#b3261e" opacity="0.28"/>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Managed shopper checking a list with one shopping bag">
  <defs>
    <linearGradient id="skinERSQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>

  <!-- background circle (deep navy, soft gold ring) -->
  <circle cx="200" cy="200" r="200" fill="#141c30"/>
  <circle cx="200" cy="200" r="165" fill="#1c2740" opacity="0.9"/>
  <circle cx="200" cy="200" r="125" fill="#d4af37" opacity="0.08"/>

  <!-- gold sparkles -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="84" y1="106" x2="84" y2="128"/><line x1="73" y1="117" x2="95" y2="117"/>
    <line x1="318" y1="118" x2="318" y2="138"/><line x1="308" y1="128" x2="328" y2="128"/>
  </g>

  <!-- neck -->
  <rect x="184" y="250" width="32" height="46" rx="10" fill="url(#skinERSQ)" stroke="#1a120c" stroke-width="6"/>

  <!-- body (light shirt, gold V) -->
  <path d="M100 400 L108 330 Q120 296 162 290 L238 290 Q280 296 292 330 L300 400 Z"
        fill="#f5e9d0" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M180 292 L200 320 L220 292 Z" fill="#e8c96a" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinERSQ)" stroke="#1a120c" stroke-width="6"/>

  <!-- hair: bang + sides -->
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M116 150 Q106 186 118 208 Q130 200 124 160 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M284 150 Q294 186 282 208 Q270 200 276 160 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- relaxed eyebrows -->
  <path d="M152 150 Q166 144 180 150" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M220 150 Q234 144 248 150" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- eyes -->
  <circle cx="166" cy="172" r="7" fill="#1a120c"/>
  <circle cx="163.5" cy="169.5" r="2.4" fill="#f5e9d0"/>
  <circle cx="234" cy="172" r="7" fill="#1a120c"/>
  <circle cx="231.5" cy="169.5" r="2.4" fill="#f5e9d0"/>

  <!-- nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- satisfied smile -->
  <path d="M170 230 Q200 252 230 230" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>

  <!-- small gold shopping bag (left) -->
  <path d="M90 300 L138 300 L144 358 L84 358 Z"
        fill="#d4af37" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <line x1="89" y1="318" x2="139" y2="318" stroke="#e8c96a" stroke-width="5" stroke-linecap="round"/>
  <path d="M102 300 Q114 278 126 300" stroke="#1a120c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- left hand gripping the handle -->
  <circle cx="114" cy="288" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- checklist (right, slightly tilted) -->
  <g transform="rotate(-6 280 320)">
    <rect x="248" y="282" width="64" height="80" rx="6" fill="#f5e9d0" stroke="#1a120c" stroke-width="6"/>
    <rect x="268" y="274" width="24" height="12" rx="4" fill="#d4af37" stroke="#1a120c" stroke-width="4"/>
    <path d="M256 300 l6 6 l10 -11" stroke="#b3261e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="278" y1="300" x2="302" y2="300" stroke="#1c2740" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 322 l6 6 l10 -11" stroke="#b3261e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="278" y1="322" x2="302" y2="322" stroke="#1c2740" stroke-width="4" stroke-linecap="round"/>
    <rect x="256" y="338" width="12" height="12" rx="2" fill="none" stroke="#1a120c" stroke-width="4"/>
    <line x1="278" y1="344" x2="302" y2="344" stroke="#1c2740" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- right hand holding the list -->
  <circle cx="250" cy="356" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
</svg>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Style-conscious person checking a hand mirror with one sweat drop and a lipstick">
  <defs>
    <linearGradient id="skinEISQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="200" cy="200" r="200" fill="#141c30"/>
  <circle cx="200" cy="200" r="160" fill="#d4af37" opacity="0.08"/>
  <circle cx="200" cy="200" r="120" fill="#e8c96a" opacity="0.08"/>

  <!-- sparkles -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round">
    <line x1="86" y1="96" x2="86" y2="116"/><line x1="76" y1="106" x2="96" y2="106"/>
    <line x1="322" y1="188" x2="322" y2="206"/><line x1="313" y1="197" x2="331" y2="197"/>
  </g>

  <!-- neck -->
  <rect x="184" y="252" width="32" height="40" fill="url(#skinEISQ)" stroke="#1a120c" stroke-width="6"/>
  <!-- body (parchment top with gold collar) -->
  <path d="M112 400 Q110 332 152 302 Q174 288 200 288 Q226 288 248 302 Q290 332 288 400 Z"
        fill="#f5e9d0" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M182 290 L200 316 L218 290 Z" fill="#e8c96a" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="112" cy="186" r="11" fill="url(#skinEISQ)" stroke="#1a120c" stroke-width="6"/>
  <circle cx="288" cy="186" r="11" fill="url(#skinEISQ)" stroke="#1a120c" stroke-width="6"/>
  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinEISQ)" stroke="#1a120c" stroke-width="6"/>
  <!-- hair (simple bang + sides) -->
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 164 Q110 192 120 210 Q130 192 128 158 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M286 164 Q290 192 280 210 Q270 192 272 158 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- slightly worried brows -->
  <path d="M152 150 Q166 143 180 148" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M222 148 Q236 143 250 150" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- eyes glancing toward the mirror -->
  <circle cx="162" cy="174" r="7" fill="#1a120c"/>
  <circle cx="230" cy="174" r="7" fill="#1a120c"/>
  <circle cx="159.5" cy="171" r="2.4" fill="#f5e9d0"/>
  <circle cx="227.5" cy="171" r="2.4" fill="#f5e9d0"/>

  <!-- one sweat drop on the temple -->
  <path d="M273 100 C282 115 290 125 283 136 C278 144 265 143 261 133 C257 123 265 112 273 100 Z"
        fill="#f5e9d0" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>

  <!-- nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- nervous lopsided smile -->
  <path d="M174 234 Q200 244 228 226" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- cheeks -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>

  <!-- hand mirror (gold frame, tiny reflection) -->
  <line x1="126" y1="286" x2="150" y2="320" stroke="#1a120c" stroke-width="18" stroke-linecap="round"/>
  <line x1="126" y1="286" x2="150" y2="320" stroke="#d4af37" stroke-width="10" stroke-linecap="round"/>
  <circle cx="108" cy="258" r="34" fill="#d4af37" stroke="#1a120c" stroke-width="6"/>
  <circle cx="108" cy="258" r="24" fill="#f5e9d0" stroke="#1a120c" stroke-width="4"/>
  <circle cx="108" cy="260" r="11" fill="#f7d7b5"/>
  <path d="M97 256 Q108 244 119 256 Q108 251 97 256 Z" fill="#3d2b1f"/>
  <circle cx="104" cy="261" r="1.8" fill="#1a120c"/>
  <circle cx="112" cy="261" r="1.8" fill="#1a120c"/>
  <!-- hand gripping the handle -->
  <circle cx="152" cy="324" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- other hand -->
  <circle cx="254" cy="330" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- lipstick beside -->
  <rect x="290" y="306" width="26" height="48" rx="6" fill="#d4af37" stroke="#1a120c" stroke-width="6"/>
  <path d="M294 306 L294 288 Q294 280 303 280 L308 280 L312 292 L312 306 Z"
        fill="#b3261e" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>
  <line x1="290" y1="322" x2="316" y2="322" stroke="#1a120c" stroke-width="4"/>
</svg>

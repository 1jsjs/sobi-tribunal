<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dreamy free spirit under crescent moon and stars">
  <defs>
    <linearGradient id="skinGIFQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- night sky -->
  <circle cx="200" cy="200" r="200" fill="#0f1420"/>
  <circle cx="200" cy="200" r="165" fill="#1c2740" opacity="0.75"/>
  <circle cx="200" cy="200" r="125" fill="#d4af37" opacity="0.07"/>

  <!-- crescent moon -->
  <path d="M96 50 A34 34 0 0 0 96 118 A44 44 0 0 1 96 50 Z"
        fill="#e8c96a" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- stars -->
  <g stroke="#e8c96a" stroke-width="6" stroke-linecap="round">
    <line x1="300" y1="66" x2="300" y2="90"/><line x1="288" y1="78" x2="312" y2="78"/>
    <line x1="332" y1="150" x2="332" y2="170"/><line x1="322" y1="160" x2="342" y2="160"/>
    <line x1="66" y1="196" x2="66" y2="214"/><line x1="57" y1="205" x2="75" y2="205"/>
  </g>
  <circle cx="252" cy="52" r="5" fill="#d4af37"/>
  <circle cx="342" cy="230" r="5" fill="#d4af37"/>
  <circle cx="86" cy="158" r="4" fill="#d4af37"/>

  <!-- body: cozy gold top with round shoulders -->
  <path d="M108 400 L108 344 Q108 296 156 288 L244 288 Q292 296 292 344 L292 400 Z"
        fill="#e8c96a" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- hands gently clasped while dreaming -->
  <circle cx="178" cy="332" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <circle cx="222" cy="332" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- ears -->
  <ellipse cx="111" cy="192" rx="9" ry="13" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <ellipse cx="289" cy="192" rx="9" ry="13" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinGIFQ)" stroke="#1a120c" stroke-width="6"/>

  <!-- hair: side locks + bang -->
  <path d="M120 146 Q104 178 114 212 Q122 218 130 212 Q118 182 132 150 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M280 146 Q296 178 286 212 Q278 218 270 212 Q282 182 268 150 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- calm brows -->
  <path d="M154 152 Q166 146 178 152" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M222 152 Q234 146 246 152" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- dreamy closed eyes -->
  <path d="M152 172 Q166 184 180 172" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M220 172 Q234 184 248 172" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- small nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- soft blissful smile -->
  <path d="M182 232 Q200 248 218 232" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
</svg>

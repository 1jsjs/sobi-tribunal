<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GRFQ — calm tea lover">
  <defs>
    <linearGradient id="skinGRFQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d7b5"/>
      <stop offset="1" stop-color="#eec49c"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="200" cy="200" r="200" fill="#141c30"/>
  <circle cx="200" cy="200" r="160" fill="#d4af37" opacity="0.10"/>
  <circle cx="200" cy="200" r="120" fill="#e8c96a" opacity="0.08"/>

  <!-- soft sparkles -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="78" y1="118" x2="78" y2="140"/><line x1="67" y1="129" x2="89" y2="129"/>
    <line x1="322" y1="92" x2="322" y2="112"/><line x1="312" y1="102" x2="332" y2="102"/>
    <line x1="66" y1="252" x2="66" y2="270"/><line x1="57" y1="261" x2="75" y2="261"/>
  </g>

  <!-- neck -->
  <path d="M184 252 L216 252 L216 294 L184 294 Z" fill="#eec49c" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- body (parchment cardigan, round shoulders) -->
  <path d="M110 400 L112 340 Q118 300 156 290 L244 290 Q282 300 288 340 L290 400 Z"
        fill="#f5e9d0" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M178 292 L200 322 L222 292 Z" fill="#e8c96a" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>

  <!-- resting hand -->
  <circle cx="100" cy="330" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>

  <!-- face -->
  <circle cx="200" cy="180" r="86" fill="url(#skinGRFQ)" stroke="#1a120c" stroke-width="6"/>
  <!-- hair -->
  <path d="M114 168 Q118 96 200 92 Q282 96 286 168 Q286 128 200 122 Q114 128 114 168 Z"
        fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M114 166 Q112 184 120 200 Q130 190 128 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M286 166 Q288 184 280 200 Q270 190 272 168 Z" fill="#3d2b1f" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>

  <!-- relaxed brows -->
  <path d="M150 150 Q166 144 182 150" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M218 150 Q234 144 250 150" stroke="#1a120c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- serene closed eyes -->
  <path d="M152 174 Q166 162 180 174" stroke="#1a120c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M220 174 Q234 162 248 174" stroke="#1a120c" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- nose -->
  <path d="M197 190 q6 8 0 14" stroke="#1a120c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- gentle smile -->
  <path d="M176 230 Q200 244 224 230" stroke="#1a120c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="150" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>
  <ellipse cx="250" cy="204" rx="11" ry="7" fill="#b3261e" opacity="0.22"/>

  <!-- steam -->
  <g stroke="#f5e9d0" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M294 246 Q288 234 294 222 Q300 210 294 198"/>
    <path d="M316 244 Q310 232 316 220 Q322 208 316 196"/>
  </g>

  <!-- holding hand + saucer + teacup -->
  <circle cx="306" cy="310" r="15" fill="#f7d7b5" stroke="#1a120c" stroke-width="6"/>
  <ellipse cx="306" cy="302" rx="34" ry="9" fill="#f5e9d0" stroke="#1a120c" stroke-width="6"/>
  <path d="M330 268 Q350 278 328 292" fill="none" stroke="#1a120c" stroke-width="6" stroke-linecap="round"/>
  <path d="M282 262 L288 298 L324 298 L330 262 Z" fill="#f5e9d0" stroke="#1a120c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M285 278 L327 278" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="306" cy="262" rx="24" ry="7" fill="#d4af37" stroke="#1a120c" stroke-width="5"/>
</svg>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소비 재판소 법정 배경 A안">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1a2233"/>
    </linearGradient>
    <linearGradient id="curtainRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3261e"/>
      <stop offset="1" stop-color="#8f1e18"/>
    </linearGradient>
    <linearGradient id="curtainNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="woodFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2b1f"/>
      <stop offset="1" stop-color="#2a1f18"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2b1f"/>
      <stop offset="1" stop-color="#2a1f18"/>
    </linearGradient>
    <!-- one curtain panel, reused mirrored -->
    <g id="curtainPanel">
      <path d="M0,0 h150 q-10,150 6,300 q8,80 24,150 L0,450 Z" fill="url(#curtainRed)" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M38,4 q-6,160 4,300 q4,70 12,138" fill="none" stroke="#8f1e18" stroke-width="7" stroke-linecap="round"/>
      <path d="M86,4 q-4,170 4,310 q3,60 10,128" fill="none" stroke="#8f1e18" stroke-width="7" stroke-linecap="round"/>
      <path d="M128,4 q0,180 8,320 q3,55 12,118" fill="none" stroke="#8f1e18" stroke-width="7" stroke-linecap="round"/>
      <!-- gold tieback -->
      <path d="M96,330 q40,26 80,20 l-6,34 q-44,8 -86,-24 Z" fill="#d4af37" stroke="#1a120c" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- one column, reused -->
    <g id="column">
      <rect x="-34" y="96" width="68" height="380" rx="8" fill="url(#woodFront)" stroke="#1a120c" stroke-width="5"/>
      <rect x="-22" y="112" width="10" height="348" rx="5" fill="#2a1f18" stroke="none"/>
      <rect x="4" y="112" width="10" height="348" rx="5" fill="#2a1f18" stroke="none"/>
      <rect x="-46" y="70" width="92" height="30" rx="8" fill="#d4af37" stroke="#1a120c" stroke-width="5"/>
      <rect x="-40" y="98" width="80" height="14" rx="7" fill="#e8c96a" stroke="#1a120c" stroke-width="4"/>
      <rect x="-46" y="466" width="92" height="26" rx="8" fill="#d4af37" stroke="#1a120c" stroke-width="5"/>
    </g>
  </defs>

  <!-- back wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wallGrad)"/>

  <!-- soft glow behind bench center -->
  <ellipse cx="400" cy="250" rx="300" ry="200" fill="#1c2740" opacity="0.55"/>

  <!-- navy under-curtain (full backdrop between columns) -->
  <rect x="150" y="86" width="500" height="380" fill="url(#curtainNavy)" stroke="#1a120c" stroke-width="5"/>
  <!-- red curtains, parted to center -->
  <use href="#curtainPanel" x="150" y="90"/>
  <use href="#curtainPanel" x="-150" y="90" transform="scale(-1,1) translate(-500,0)"/>
  <!-- curtain rod -->
  <rect x="130" y="72" width="540" height="22" rx="11" fill="#d4af37" stroke="#1a120c" stroke-width="5"/>
  <circle cx="130" cy="83" r="14" fill="#e8c96a" stroke="#1a120c" stroke-width="5"/>
  <circle cx="670" cy="83" r="14" fill="#e8c96a" stroke="#1a120c" stroke-width="5"/>

  <!-- scales emblem (simple, high on the navy backdrop) -->
  <g stroke="#1a120c" stroke-width="4" stroke-linejoin="round">
    <circle cx="400" cy="170" r="52" fill="#0f1420"/>
    <circle cx="400" cy="170" r="52" fill="none" stroke="#d4af37" stroke-width="6"/>
    <g stroke="#e8c96a" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="400" y1="140" x2="400" y2="196"/>
      <line x1="374" y1="150" x2="426" y2="150"/>
      <line x1="374" y1="150" x2="368" y2="172"/>
      <line x1="426" y1="150" x2="432" y2="172"/>
      <path d="M356,172 h24 a12,12 0 0 1 -24,0 Z" fill="#e8c96a" stroke-width="4"/>
      <path d="M420,172 h24 a12,12 0 0 1 -24,0 Z" fill="#e8c96a" stroke-width="4"/>
      <line x1="388" y1="198" x2="412" y2="198"/>
    </g>
  </g>

  <!-- side columns (visible in mobile 400px center crop) -->
  <use href="#column" x="235" y="0"/>
  <use href="#column" x="565" y="0"/>
  <!-- outer columns for desktop width -->
  <use href="#column" x="52" y="0"/>
  <use href="#column" x="748" y="0"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="url(#floorGrad)"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#1a120c" stroke-width="6"/>
  <g stroke="#1a120c" stroke-width="3" opacity="0.5">
    <line x1="0" y1="512" x2="800" y2="512"/>
    <line x1="0" y1="556" x2="800" y2="556"/>
    <line x1="120" y1="470" x2="90" y2="512"/>
    <line x1="330" y1="470" x2="315" y2="512"/>
    <line x1="540" y1="470" x2="555" y2="512"/>
    <line x1="710" y1="470" x2="740" y2="512"/>
    <line x1="220" y1="512" x2="205" y2="556"/>
    <line x1="470" y1="512" x2="485" y2="556"/>
    <line x1="650" y1="512" x2="670" y2="556"/>
  </g>

  <!-- ===== 판사석(+판사) 전체 80px 아래로 이동 ===== -->
  <g transform="translate(0,80)">
  <!-- judge bench: upper tier (keep top edge simple for character) -->
  <g stroke="#1a120c" stroke-linejoin="round">
    <!-- bench top slab -->
    <rect x="228" y="316" width="344" height="26" rx="10" fill="#3d2b1f" stroke-width="6"/>
    <rect x="216" y="308" width="368" height="18" rx="9" fill="#d4af37" stroke-width="5"/>
    <!-- bench front body: 캔버스 바닥까지 — 판사 아래가 끊기지 않고 말풍선 뒤까지 이어진다 -->
    <rect x="236" y="338" width="328" height="266" rx="12" fill="url(#woodFront)" stroke-width="6"/>
    <!-- paneling -->
    <rect x="258" y="358" width="82" height="108" rx="8" fill="#2a1f18" stroke-width="4"/>
    <rect x="460" y="358" width="82" height="108" rx="8" fill="#2a1f18" stroke-width="4"/>
    <rect x="258" y="358" width="82" height="108" rx="8" fill="none" stroke="#d4af37" stroke-width="3"/>
    <rect x="460" y="358" width="82" height="108" rx="8" fill="none" stroke="#d4af37" stroke-width="3"/>
    <!-- center parchment plaque -->
    <rect x="352" y="360" width="96" height="70" rx="10" fill="#f5e9d0" stroke-width="5"/>
    <rect x="358" y="366" width="84" height="58" rx="7" fill="none" stroke="#d4af37" stroke-width="2"/>
    <!-- 플라크 엠블럼: 빨간 봉인 → 금화 (흰 바탕+빨간 원이 일장기처럼 보여서 교체) -->
    <circle cx="400" cy="384" r="12" fill="#d4af37" stroke-width="3"/>
    <circle cx="400" cy="384" r="6" fill="none" stroke="#e8c96a" stroke-width="2.5"/>
    <text x="400" y="418" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2a1f18">소비 재판소</text>
    <!-- gold molding (중간 띠) -->
    <rect x="224" y="482" width="352" height="20" rx="10" fill="#d4af37" stroke-width="5"/>
    <!-- 하단 패널 2열 (몰딩 아래 몸통 장식) -->
    <rect x="258" y="514" width="82" height="72" rx="8" fill="#2a1f18" stroke-width="4"/>
    <rect x="460" y="514" width="82" height="72" rx="8" fill="#2a1f18" stroke-width="4"/>
    <rect x="258" y="514" width="82" height="72" rx="8" fill="none" stroke="#d4af37" stroke-width="3"/>
    <rect x="460" y="514" width="82" height="72" rx="8" fill="none" stroke="#d4af37" stroke-width="3"/>
  </g>

  <!-- gold trim line across bench front -->
  <line x1="252" y1="348" x2="548" y2="348" stroke="#e8c96a" stroke-width="3" opacity="0.8"/>

  <!-- gavel block accents on bench top, off-center to keep middle clear -->
  <g stroke="#1a120c" stroke-width="4" stroke-linejoin="round">
    <rect x="262" y="296" width="52" height="14" rx="7" fill="#3d2b1f"/>
    <rect x="486" y="296" width="52" height="14" rx="7" fill="#3d2b1f"/>
  </g>
  </g>
  <!-- ===== /80px 이동 끝 ===== -->
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="의사봉">
  <!-- 받침대 (sound block) -->
  <rect x="36" y="160" width="128" height="20" rx="9" fill="#2a1f18" stroke="#1a120c" stroke-width="4"/>
  <rect x="60" y="146" width="80" height="18" rx="8" fill="#3d2b1f" stroke="#1a120c" stroke-width="4"/>
  <rect x="70" y="151" width="36" height="4" rx="2" fill="#e8c96a" opacity="0.35"/>

  <!-- 망치 (기울여 쾅 찍는 느낌) -->
  <g transform="rotate(-35 100 84)">
    <!-- 손잡이 -->
    <rect x="93" y="94" width="14" height="66" rx="7" fill="#2a1f18" stroke="#1a120c" stroke-width="4"/>
    <rect x="90" y="152" width="20" height="14" rx="6" fill="#d4af37" stroke="#1a120c" stroke-width="4"/>
    <!-- 머리 -->
    <rect x="58" y="56" width="84" height="40" rx="12" fill="#3d2b1f" stroke="#1a120c" stroke-width="4"/>
    <rect x="52" y="52" width="18" height="48" rx="8" fill="#d4af37" stroke="#1a120c" stroke-width="4"/>
    <rect x="130" y="52" width="18" height="48" rx="8" fill="#d4af37" stroke="#1a120c" stroke-width="4"/>
    <rect x="76" y="63" width="40" height="6" rx="3" fill="#e8c96a" opacity="0.5"/>
  </g>

  <!-- 임팩트 스파크 (만화적 쾅 효과) -->
  <g stroke="#e8c96a" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="128" x2="162" y2="118"/>
    <line x1="158" y1="142" x2="172" y2="140"/>
    <line x1="38" y1="132" x2="28" y2="124"/>
  </g>
</svg>
